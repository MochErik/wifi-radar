[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wifi-radar"
version = "1.0.0"
description = "Local Wi-Fi SSID, RSSI dBm & Signal Quality Analyzer CLI"
readme = "README.md"
authors = [
  { name = "Moch. Erik Irriansyah", email = "erik@narotama.ac.id" }
]
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = []

[project.scripts]
wifi-radar = "wifi_radar.cli:main"

[project.urls]
Homepage = "https://github.com/MochErik/wifi-radar"
Repository = "https://github.com/MochErik/wifi-radar.git"
